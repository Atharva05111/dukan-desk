<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Dukan Desk">
  <!-- Tile: brand indigo (colors.primary) -->
  <rect width="512" height="512" rx="112" fill="#4F46E5"/>

  <!-- Awning roof bar -->
  <rect x="88" y="104" width="336" height="28" rx="14" fill="#FFFFFF"/>

  <!-- Awning: 4 stripes, white / orange (colors.accent), each ending in a scallop -->
  <path d="M104 132H180V196A38 38 0 0 1 104 196Z" fill="#FFFFFF"/>
  <path d="M180 132H256V196A38 38 0 0 1 180 196Z" fill="#F97316"/>
  <path d="M256 132H332V196A38 38 0 0 1 256 196Z" fill="#FFFFFF"/>
  <path d="M332 132H408V196A38 38 0 0 1 332 196Z" fill="#F97316"/>

  <!-- Counter / desk: orange top, white front -->
  <rect x="112" y="276" width="288" height="28" rx="14" fill="#F97316"/>
  <path d="M136 304H376V392A20 20 0 0 1 356 412H156A20 20 0 0 1 136 392Z" fill="#FFFFFF"/>
  <!-- Ledger lines on the counter front (the "desk" = your books) -->
  <rect x="172" y="330" width="120" height="14" rx="7" fill="#C7C4F7"/>
  <rect x="172" y="358" width="80" height="14" rx="7" fill="#C7C4F7"/>
</svg>
