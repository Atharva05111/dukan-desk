# Render Blueprint — deploys the NestJS backend as a free web service.
# Database lives on Neon (see DATABASE_URL below), not on Render.
services:
  - type: web
    name: dukan-desk-api
    runtime: node
    plan: free
    region: singapore # closest Render region to India; create the Neon DB in Singapore too
    rootDir: backend
    # Install (incl. dev deps: nest CLI + prisma are needed to build), apply any
    # pending DB migrations, then compile TypeScript to dist/.
    buildCommand: npm ci --include=dev && npm run prisma:deploy && npm run build
    startCommand: npm run start:prod
    envVars:
      # Neon *direct* connection string (host without "-pooler"), ending in ?sslmode=require
      - key: DATABASE_URL
        sync: false
      # Render generates long random secrets — never reuse the local "change-me" ones.
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
